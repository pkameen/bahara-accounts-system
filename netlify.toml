[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/send-invoice-whatsapp"
  to = "/.netlify/functions/send-invoice-whatsapp"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
